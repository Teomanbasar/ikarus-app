<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IKARUS Quant</title>
<meta name="description" content="BIST hisselerinin IKARUS tablosu: ucuz, pahalı ve sinyal veren hisseler.">
<meta name="theme-color" content="#1D4ED8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IKARUS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --line:#E1E5EA; --line2:#EEF0F3; --ink:#111827; --ink2:#374151; --mute:#4B5563;
  --acc:#1D4ED8; --acc-soft:#DBEAFE; --acc-ink:#1E3A8A; --zone:#BFD3FB; --track:#E5E9F0;
  --warn-soft:#FFEDD5; --warn-ink:#9A3412; --bad-soft:#FEE2E2; --bad-ink:#991B1B; --neu-soft:#E5E7EB; --neu-ink:#374151;
  --up:#047857; --down:#B91C1C; --ctl:#F9FAFB; --ctl-line:#CBD2DA;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1420; --card:#151D2B; --line:#243044; --line2:#1D2737; --ink:#E5E9F0; --ink2:#C7CFDB; --mute:#94A0B4;
    --acc:#5B8CFF; --acc-soft:#1E2E57; --acc-ink:#C9D8FF; --zone:#29437A; --track:#243044;
    --warn-soft:#3B2614; --warn-ink:#FDBA74; --bad-soft:#3A1A1E; --bad-ink:#FCA5A5; --neu-soft:#232C3B; --neu-ink:#C7CFDB;
    --up:#34D399; --down:#F87171; --ctl:#1A2333; --ctl-line:#2E3A50;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--acc);text-decoration:none}
button{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 0}
.brand{display:flex;align-items:baseline;gap:6px;color:var(--ink)}
.brand b{font-size:20px;letter-spacing:.04em}
.brand span{font-size:12px;color:var(--mute);font-weight:500}
.spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--ctl-line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;min-height:40px;padding:0 14px;font-size:14px;cursor:pointer}
.seg button+button{border-left:1px solid var(--ctl-line)}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff;font-weight:600}
.mkt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 0 12px}
.mkt div{display:flex;flex-direction:column;gap:2px;min-width:0}
.mkt small{font-size:11px;color:var(--mute)}
.mkt strong{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chg-up{color:var(--up)} .chg-down{color:var(--down)}
.search{display:flex;gap:8px;padding:12px 0 4px}
.search input{flex:1;min-width:0;min-height:44px;border:1px solid var(--ctl-line);border-radius:10px;background:var(--card);color:var(--ink);padding:0 12px;font:inherit;font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--ctl-line);background:var(--card);color:var(--ink2);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.groups{display:flex;gap:6px;margin:12px 0 8px;padding:4px;background:var(--track);border-radius:12px}
.grp{flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:600;font-size:14px;padding:9px 6px;border-radius:9px;cursor:pointer}
.grp[aria-pressed="true"]{background:var(--card,#fff);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grp .n{font-weight:500;color:var(--mute);font-size:12px}
.warnb{font-size:11px;font-weight:700;color:var(--warn-ink);border:1px solid var(--warn-ink);border-radius:999px;padding:1px 7px}
.fazb{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.fazb small{font-weight:500;opacity:.85}
.fazb.iki small{color:#fff !important}
.fazb.iki{background:var(--acc);color:#fff}
.fazb.bir{border:1px solid var(--acc);color:var(--acc)}
.fazb.yok{color:var(--mute);border:1px solid var(--line)}
.kutu{border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 12px;display:flex;flex-direction:column;gap:8px}
.kutu .kb{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.kutu .kk{font-size:20px;font-weight:800;letter-spacing:.2px}
.kutu.al{border-color:var(--acc)} .kutu.al .kk{color:var(--acc)}
.kutu.bekle .kk{color:var(--ink)} .kutu.sat{border-color:var(--warn-ink)} .kutu.sat .kk{color:var(--warn-ink)}
.kutu.uzak .kk,.kutu.yok .kk{color:var(--mute)}
.kutu .adim{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kutu .adim div{font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;line-height:1.3}
.kutu .adim div.ok{border-color:var(--acc)} .kutu .adim div b{display:block;font-size:12px}
.kutu small{color:var(--ink2);line-height:1.45}
.kchip{font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;border:1px solid var(--line);color:var(--ink2)}
.kchip.al{background:var(--acc);color:#fff;border-color:var(--acc)} .kchip.sat{color:var(--warn-ink);border-color:var(--warn-ink)}
.ayrac{grid-column:1/-1;font-size:12.5px;font-weight:700;color:var(--ink2);padding:10px 2px 2px;border-bottom:1px solid var(--line)}
@media (max-width:520px){.kutu .adim{grid-template-columns:repeat(2,minmax(0,1fr))}}
.eldef{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--card,#fff)}
.eldef input{flex:1 1 140px;font:inherit;padding:8px 10px;border:1px solid var(--ctl-line);border-radius:8px;background:transparent;color:var(--ink)}
.eldef button,.sil{font:inherit;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.sil{padding:3px 9px;font-size:12px;background:transparent;color:var(--mute);border-color:var(--line)}
.row.elde .l{text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:4px}
.bakim{margin:16px 0 0;padding:10px 14px;border:1px solid var(--warn-ink);border-radius:10px;font-size:13px;color:var(--ink2)}
.bakim ul{margin:6px 0;padding-left:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.chip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--ctl-line);color:var(--ink2)}
.chip.ok{color:var(--acc);border-color:var(--acc)}
.chip.kotu{color:var(--warn-ink);border-color:var(--warn-ink)}
.tab[aria-selected="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.tab .n{font-family:"IBM Plex Mono",monospace;font-weight:500;opacity:.8}
.genel{background:var(--warn-soft);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;margin:4px 0 10px}
.genel b{font-weight:600}
.hint.desc{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--ink2);line-height:1.45}
.hint{font-size:12px;color:var(--mute);margin:2px 0 8px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:8px;padding-bottom:24px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;color:var(--ink);min-height:64px}
.row:hover{border-color:var(--ctl-line)}
.row .l{display:flex;flex-direction:column;gap:6px;min-width:0}
.row .t{display:flex;align-items:baseline;gap:8px;min-width:0}
.row .t b{font-size:15px}
.row .t .nm{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .p{font-size:13px;color:var(--mute)}
.meter{position:relative;height:6px;width:100%;max-width:200px;background:var(--track);border-radius:3px;display:block}
.meter .z{position:absolute;left:0;top:0;bottom:0;width:20%;background:var(--zone);border-radius:3px 0 0 3px}
.meter .m{position:absolute;top:-3px;width:4px;height:12px;border-radius:2px;background:var(--acc)}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row .r small{font-size:12px;color:var(--mute)}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-ALINABILIR{background:var(--acc);color:#fff}
.b-TOPLANIYOR{background:var(--acc-soft);color:var(--acc-ink)}
.b-YAKIN{background:var(--warn-soft);color:var(--warn-ink)}
.b-DAGITIM{background:var(--bad-soft);color:var(--bad-ink)}
.b-BEKLE{background:var(--neu-soft);color:var(--neu-ink)}
.new{font-size:10px;font-weight:700;color:var(--acc);letter-spacing:.04em}
.empty{background:var(--card);border:1px dashed var(--ctl-line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--mute);font-size:14px}
footer{font-size:11px;color:var(--mute);padding:8px 0 calc(24px + env(safe-area-inset-bottom))}
/* detay */
.dhead{display:flex;align-items:center;gap:8px;padding:12px 0}
.back{width:44px;height:44px;border:1px solid var(--ctl-line);border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.dtitle{display:flex;flex-direction:column;min-width:0}
.dtitle b{font-size:20px}
.dtitle span{font-size:12px;color:var(--mute);line-height:1.35}
.grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;padding-bottom:16px}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h2{margin:0 0 10px;font-size:15px}
.price{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.price .v{font-size:28px;font-weight:600}
.band{position:relative;height:30px;margin:14px 0 10px}
.band .tr{position:absolute;left:0;right:0;top:10px;height:10px;border-radius:5px;background:var(--track)}
.band .zn{position:absolute;left:0;top:10px;height:10px;border-radius:5px 0 0 5px;background:var(--zone)}
.band .mk{position:absolute;top:2px;width:4px;height:26px;border-radius:2px;background:var(--ink);transform:translateX(-2px)}
.band .st{position:absolute;top:6px;width:2px;height:18px;background:var(--warn-ink);opacity:.8}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio div{display:flex;flex-direction:column}
.trio div:nth-child(2){align-items:center}
.trio div:nth-child(3){align-items:flex-end}
.trio small{font-size:11px;color:var(--mute)}
.trio strong{font-size:16px;font-weight:600}
.cond{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;min-height:34px;border-top:1px solid var(--line2)}
.cond:first-of-type{border-top:0}
.cond span{font-size:14px}
.cond em{font-style:normal;font-size:13px;color:var(--mute)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:14px}
.kv:first-of-type{border-top:0}
.kv span{color:var(--ink2)}
.kv strong{font-weight:600;display:flex;align-items:center;gap:8px}
.mini{width:48px;height:6px;border-radius:3px;background:var(--track);position:relative;display:inline-block}
.mini i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--acc)}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--ctl-line);background:var(--ctl);color:var(--ink);font-size:14px;font-weight:600}
.note{font-size:12px;color:var(--mute);margin:10px 0 0}
.fs{display:grid;grid-template-columns:24px 1fr auto;gap:2px 8px;align-items:start;padding:9px 0;border-top:1px solid var(--line2)}
.fs:first-of-type{border-top:0}
.fs span{font-size:14px}
.fs em{font-style:normal;font-size:13px;color:var(--ink2);white-space:nowrap}
.fs p{grid-column:2/4;margin:0;font-size:12px;color:var(--mute);line-height:1.4}
.fs svg{margin-top:1px}
.quad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:2px 0 10px;padding-bottom:10px;border-bottom:1px solid var(--line2)}
.quad div{display:flex;flex-direction:column}
.quad small{font-size:11px;color:var(--mute)}
.quad strong{font-size:15px;font-weight:600}
.hidden{display:none !important}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#"><b>IKARUS</b><span>Quant</span></a>
      <div class="spacer"></div>
      <div class="seg" role="group" aria-label="Zaman dilimi">
        <button type="button" data-tf="D" aria-pressed="true">Günlük</button>
        <button type="button" data-tf="W" aria-pressed="false">Haftalık</button>
      </div>
    </div>
    <div class="mkt" id="mkt">
      <div><small>BIST 100</small><strong class="mono" id="m-xu">–</strong></div>
      <div><small>M3 para arzı</small><strong class="mono" id="m-m3">–</strong></div>
      <div><small>Makro</small><strong id="m-mk">–</strong></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="home">
    <div class="search"><input id="q" type="search" placeholder="Hisse ara: THYAO, Akbank…" autocomplete="off" aria-label="Hisse ara"></div>
    <div class="groups" id="groups" aria-label="Bölümler"></div>
    <div class="tabs" role="tablist" aria-label="Listeler" id="tabs"></div>
    <div class="genel hidden" id="genel" role="note"></div>
    <p class="hint" id="hint"></p>
    <div class="list" id="list"></div>
  </section>

  <section id="detail" class="hidden" aria-live="polite"></section>

  <div id="bakim" class="bakim hidden" role="note"></div>
  <footer id="foot">Yatırım tavsiyesi değildir.</footer>
</main>

<script>
(() => {
  const TABS = [
    ['ALINABILIR', 'Alınabilir', 'Altı şartın hepsi tamam. Sistemin “alınabilir” dediği tek durum. Kesin yükselir demek değil; şartlar oluştu demek.'],
    ['TOPLANIYOR', 'Toplanıyor', 'Ucuz, en fazla 2 şart eksik, fiyat düşmüyor ve endekse göre güçleniyor. Biri sessizce topluyor olabilir; Alınabilir’e en yakın aday.'],
    ['YAKIN', 'Yakın', 'Ucuz ve en fazla 2 şart eksik, ama endekse göre güçlenme yok. Şartlara yaklaşıyor; takipte tut.'],
    ['DAGITIM', 'Dağıtım', 'Ucuz ama bugün düşüyor; mal satılıyor olabilir. Henüz alma, düşüş sürebilir.'],
    ['yeni', 'Bugün yeni', 'Alınabilir, Toplanıyor veya Yakın sinyali bugün başlayan hisseler.'],
    ['temel', 'Temel sıra', 'Bilanço puanı (0–100), üç eşit parça: son bilançodaki ivme (kâr sürprizi, satış büyümesi, kârlılık artışı), kalite (F-skoru, ROE), değerleme (asıl F/K = firma değeri/FAVÖK ve PD/DD; bankalarda F/K). Bankalar kendi içinde sıralanır. 2020–2026 testinde en üst %20, bilanço sonrası 3 ayda BIST100’ü ortalama 3,6 puan geçti; en alt %20 geride kaldı. ⚡ işaretliler hızlı yükselmiş, bilanço fiyatlanmış olabilir.'],
    ['ucuz', 'En ucuz', 'Percentile ≤ 20: son 200 barın en alt bölgesi. Aralarında Toplam skoru yüksek olanlar üstte.'],
    ['pahali', 'En pahalı', 'Percentile ≥ 80: son 200 barın en üst bölgesi.'],
    ['stop', "Stop'u kıranlar", "Önceki Stop seviyesinin %3,5'ten fazla altına inenler. Sistem bunlarda BEKLE der."],
    ['tum', 'Tümü', 'Bütün hisseler, alfabetik. BEKLE: ya ucuz değil ya da çok şart eksik.']
  ];
  TABS.unshift(['elde', 'Eldekiler', 'Elinizdeki hisseleri ekleyin; her akşamki taramayla kontrol edilir (günlük veri). SAT: (1) Kâr al: fiyat son 200 günün en pahalı bölgesine geldi (Percentile ≥ 90; 80–90 arası DİKKAT); (2) Takip eden stop: alıştan %20 yükseldikten sonra zirveden %15 geri gelirse — kazancı korur (alış tarihi gerekir). 2023–2026 portföy testinde bu ikili eski kuraldan (Percentile 80) daha çok kazandırdı ve en kötü düşüşü azalttı; (3) Temel bozuldu: temel puan sırası %60’ın altına düştü ya da kötü bilanço sürprizi geldi. DİKKAT: IKARUS stop çizgisi kırıldı ya da faz motoru 10+ gündür DAĞITIM — testte bu durumlarda satmak ortalama kaybettirdi (sonra toparlandı), o yüzden yalnız uyarı. Kalıcı liste için Telegram botuna "ekle KCHOL 250 17.11.2026" yazın: bulutta saklanır, her cihazda görünür, akşam özetinde de kararı gelir. Buradan eklenenler yalnız bu tarayıcıda kalır.']);
  TABS.unshift(['firsat', 'Fırsatlar', 'Bilançosu güçlü (temel puanı en üst %20), son bilançosu kötü sürpriz değil, IKARUS’ta ucuz bölgede (Percentile ≤ 20), fiyatı kaçmamış (20 günde endeksten en fazla +%10, 5 günde en fazla +%15) ve hisseye özel çöküş yok. ✓ işareti: faz motoru alım tarafında (normal ve/veya Heikin Ashi mum). Üstte AL (✓ ya da ✓✓, faz motoru alım tarafında), altta İZLE (iyi ve ucuz ama teknik dönmedi). Listeden çıkmak satış sinyali değil. Aldıktan sonra Eldekiler’e ekle: fiyat çok pahalı bölgeye gelince (Percentile ≥ 90) kâr al, alıştan %20 yükseldikten sonra zirveden %15 düşerse sat (takip eden stop), bilanço bozulursa sat; DAĞITIM etiketine bakıp satma (testte kaybettirdi). 2022–2026 simülasyonunda iki ✓ ile alınanlar BIST100’ü işlem başına ortalama ~8 puan geçti (medyan +2, %54’ü geçti); kriz dönemlerinde alınanlar daha da iyi. Garanti değil; tek hisseye değil birkaçına dağıtın.']);
  TABS.push(['defter', 'Kayıt defteri', 'Sistemin canlı sınavı. 16 Kasım 2026’dan beri karar kutusunun AL (✓ ya da ✓✓) dediği her hisse, ertesi günün kapanış fiyatından otomatik olarak deftere yazılır; ertesi gün kapanıştan “satılır”. Çıkış için iki kural yan yana izlenir: YENİ (Percentile ≥ 90’da kâr al + takip eden stop: alıştan +%20 sonra zirveden %15) ve ESKİ (Percentile ≥ 80’de kâr al); ikisinde de bilanço bozulursa satılır. Hangisinin daha iyi olduğunu canlı sonuç gösterecek. Geriye dönük düzeltilemez; getiriler temettü/bölünme düzeltmeli fiyatla, %0,2 alış + %0,2 satış maliyeti düşülerek hesaplanır. Her kayıt eşit tutarda sayılır. Gerçek alım değildir, sistemin sanal takibidir.']);
  TABS.push(['geri_alim', 'Geri alım yapanlar', 'Son 30 günde KAP’a “Payların Geri Alınmasına İlişkin Bildirim” yapan şirketler (şirket kendi hissesini borsadan alıyor). Üstte yeni başlayan geri alım dalgaları (son 60 gün). 2021–2026 testinde: yeni geri alım dalgası başlayan şirketler sonraki 6 ayda piyasayı ortalama %12 (ortanca %5,6) geçti, her yıl artıda kaldı; 2023 deprem dönemindeki toplu alımlar daha zayıftı. Fırsatlar’ın AL bölümünde geri alım yapanlar öne alınır (2025–26 testinde 5 hisseyle x1,33 → x1,61). Tek başına al sinyali değil: bilanço ve ucuzluk için karar kutusuna bakın.']);
  const GROUPS = [['firsat', 'Fırsatlar', ['firsat', 'geri_alim']],
                  ['teknik', 'Teknik', ['ALINABILIR', 'TOPLANIYOR', 'YAKIN', 'DAGITIM', 'yeni', 'ucuz', 'pahali', 'stop', 'tum']],
                  ['elde', 'Eldekiler', ['elde']],
                  ['temel', 'Temel sıra', ['temel']],
                  ['defter', 'Kayıt defteri', ['defter']]];
  const grpOf = (tab) => (GROUPS.find(g => g[2].includes(tab)) || GROUPS[0])[0];
  const SIGDESC = Object.fromEntries(TABS.filter(t => ['ALINABILIR', 'TOPLANIYOR', 'YAKIN', 'DAGITIM'].includes(t[0])).map(t => [t[0], t[2]]));
  SIGDESC.BEKLE = 'Ya ucuz değil ya da 3+ şart eksik; ya da fiyat önceki Stop’un %3,5’ten fazla altında (stop kırıldı). Bekle.';
  const COND = {Percentile:'Ucuz: Percentile ≤ 35', Recovery:'Toparlanma: Recovery ≥ 6', Kalite:'Kalite: Toplam ≥ 36',
                MTF:'Haftalık onay: MTF ≤ 50', Hacim:'Hacim ≥ 1,20× ortalama', Macro:'Makro: GENİŞLEME veya RISK-ON'};
  const st = { tf: load('tf', 'D'), tab: load('tab4', 'firsat'), q: '', data: null };
  const $ = (s) => document.querySelector(s);
  const nf = (x, d = 2) => x == null || isNaN(x) ? '–' : Number(x).toLocaleString('tr-TR', {minimumFractionDigits: d, maximumFractionDigits: d});
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const trLbl = (s) => String(s || '').replace('GENISLEME', 'GENİŞLEME').replace('NOTR', 'NÖTR').replace('DAGITIM', 'DAĞITIM').replace('ALINABILIR', 'ALINABİLİR');
  function load(k, d) { try { return localStorage.getItem('ik_' + k) || d; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem('ik_' + k, v); } catch (e) {} }

  async function fetchData() {
    try {
      const r = await fetch('data/sonuclar.json?t=' + Date.now(), {cache: 'no-store'});
      if (!r.ok) throw new Error(r.status);
      st.data = await r.json();
    } catch (e) {
      st.data = null;
    }
    try {
      const r2 = await fetch('data/elde.json?t=' + Date.now(), {cache: 'no-store'});
      st.bulut = r2.ok ? ((await r2.json()).liste || []) : [];
    } catch (e) { st.bulut = st.bulut || []; }
    render();
  }

  function stocks() { return st.data ? st.data.hisseler : []; }
  function byT() { const m = {}; stocks().forEach(s => m[s.t] = s); return m; }

  function renderMarket() {
    const p = st.data && st.data.piyasa;
    if (!p) return;
    const c = p.xu100_degisim;
    $('#m-xu').innerHTML = esc(nf(p.xu100, 0)) + ` <span class="${c >= 0 ? 'chg-up' : 'chg-down'}" style="font-size:12px">${c >= 0 ? '+' : ''}${nf(c)}%</span>`;
    $('#m-m3').textContent = nf(p.m3 / 1e12, 2) + ' tr ₺';
    $('#m-mk').textContent = trLbl(p.makro);
    const d = st.data.olusturma ? st.data.olusturma.replace(/(\d{4})-(\d\d)-(\d\d)/, '$3.$2.$1') : '';
    const bk = (st.data.bakim && st.data.bakim.uyarilar) || [];
    $('#bakim').classList.toggle('hidden', !bk.length);
    $('#bakim').innerHTML = bk.length ? `<b>Bakım gerekiyor (${bk.length})</b><ul>${bk.map(u => `<li>${esc(u)}</li>`).join('')}</ul><small>Claude'a “bakım uyarılarını kontrol et ve düzelt” yazmanız yeterli.</small>` : '';
    $('#foot').textContent = `Son tarama: ${d} · Veri: ${p.xu100_tarih.split('-').reverse().join('.')} kapanışı · ${st.data.surum || ''} · Yatırım tavsiyesi değildir.`;
  }

  const ALIM = ['ALINABILIR', 'TOPLANIYOR', 'YAKIN'];
  function listFor(tab, araYok) {
    if (!st.data) return [];
    const M = byT();
    const LL = st.data.listeler[st.tf] || {};
    const sig = (t) => M[t] && M[t][st.tf] && M[t][st.tf].sinyal;
    let ts;
    if (tab === 'tum') ts = stocks().map(s => s.t).sort();
    else if (SIGDESC[tab]) ts = (LL.sinyal || []).filter(t => sig(t) === tab);
    else if (tab === 'elde') ts = elde().map(x => x.t);
    else if (tab === 'defter') ts = (((st.data.defter || {}).liste_acik) || []).map(x => x.t);
    else if (tab === 'yeni') ts = (LL.yeni || []).filter(t => ALIM.includes(sig(t)));
    else if (tab === 'ucuz') ts = (LL.ucuz || []).filter(t => M[t] && M[t][st.tf]).sort((a, b) => (M[b][st.tf].toplam || 0) - (M[a][st.tf].toplam || 0));
    else ts = LL[tab] || [];
    let L = ts.map(t => M[t]).filter(s => s && s[st.tf]);
    const q = araYok ? '' : st.q.trim().toLocaleUpperCase('tr-TR');
    if (q) {
      L = stocks().filter(s => s[st.tf] && (s.t.includes(q) || String(s.ad).toLocaleUpperCase('tr-TR').includes(q)));
      L.sort((a, b) => (a.t.startsWith(q) ? 0 : 1) - (b.t.startsWith(q) ? 0 : 1) || a.t.localeCompare(b.t));
    }
    return L;
  }

  function rightText(r, tab, s) {
    const v = s && s.temel && s.temel.v3;
    if (tab === 'geri_alim' && s && s.geri_alim) return `${s.geri_alim.n30} bildirim/30g · başlangıç ${s.geri_alim.dalga_bas.slice(8, 10)}.${s.geri_alim.dalga_bas.slice(5, 7)}`;
    if ((tab === 'temel' || tab === 'firsat') && v) return 'Temel ' + nf(100 * v.toplam, 0) + (v.etiketler && v.etiketler.includes('Kotu bilanco surprizi') ? ' · ⚠' : '');
    if (tab === 'ucuz') return 'Pct ' + nf(r.percentile, 1) + ' · Toplam ' + nf(r.toplam, 1);
    if (tab === 'pahali') return 'Pct ' + nf(r.percentile, 1);
    if (tab === 'stop') return "Stop'a " + nf(r.d_stop, 1) + '%';
    return 'Toplam ' + nf(r.toplam, 1);
  }

  function renderTabs() {
    const g = grpOf(st.tab);
    const cnt = (id) => st.data ? listFor(id, true).length : 0;
    $('#groups').innerHTML = GROUPS.map(([id, label, tabs]) =>
      `<button type="button" class="grp" data-grp="${id}" aria-pressed="${g === id && !st.q}">${esc(label)}${tabs.length === 1 ? ` <span class="n">${cnt(tabs[0])}</span>` : ''}</button>`).join('');
    const tabs = (GROUPS.find(x => x[0] === g) || GROUPS[0])[2];
    $('#tabs').classList.toggle('hidden', tabs.length < 2);
    $('#tabs').innerHTML = tabs.map(id => {
      const label = (TABS.find(t => t[0] === id) || [id, id])[1];
      return `<button type="button" class="tab" role="tab" data-tab="${id}" aria-selected="${st.tab === id && !st.q}">${esc(label)} <span class="n">${cnt(id)}</span></button>`;
    }).join('');
  }

  function renderList() {
    const tab = st.tab;
    $('#hint').classList.toggle('desc', !st.q);
    $('#hint').textContent = st.q ? `“${st.q}” için sonuçlar` : (TABS.find(t => t[0] === tab) || TABS[0])[2] + (st.tf === 'W' ? ' (haftalık)' : '');
    if (!st.data) {
      $('#list').innerHTML = `<div class="empty">Henüz tarama sonucu yok. İlk tarama bu akşam 18:40'tan sonra burada görünecek.</div>`;
      return;
    }
    const S = stocks().filter(x => x[st.tf]);
    const dipte = S.filter(x => x[st.tf].percentile <= 20).length;
    const oran = S.length ? Math.round(100 * dipte / S.length) : 0;
    $('#genel').classList.toggle('hidden', oran < 50 || !!st.q || grpOf(tab) !== 'teknik');
    $('#genel').innerHTML = `<b>Piyasanın %${oran}'i son 200 ${st.tf === 'W' ? 'haftanın' : 'günün'} dibinde.</b> Bütün borsa birlikte düştüğü için “ucuz” etiketi bugün hisseleri ayırmıyor.`;
    const L = listFor(tab);
    if (tab === 'elde' && !st.q) { renderElde(); return; }
    if (tab === 'defter' && !st.q) { renderDefter(); return; }
    if (!L.length) { $('#list').innerHTML = `<div class="empty">Bu listede bugün hisse yok.</div>`; return; }
    const ayr = (tab === 'firsat' && !st.q) ? (() => {
      const nAl = L.filter(s => (s.faz && ((s.faz.normal || {}).alim || (s.faz.ha || {}).alim))).length;
      return {0: `<div class="ayrac">AL — faz motoru alım tarafında (${nAl})</div>`,
              [nAl]: `<div class="ayrac">İZLE — iyi ve ucuz, teknik henüz dönmedi (${L.length - nAl})</div>`};
    })() : {};
    $('#list').innerHTML = L.slice(0, 400).map((s, i) => (ayr[i] || '') + (() => {
      const r = s[st.tf];
      const c = r.degisim;
      return `<a class="row" href="#/${encodeURIComponent(s.t)}">
        <span class="l">
          <span class="t"><b>${esc(s.t)}</b><span class="nm">${esc(s.ad)}</span></span>
          <span class="p mono">${nf(r.fiyat)} ₺ <span class="${c >= 0 ? 'chg-up' : 'chg-down'}">${c >= 0 ? '+' : ''}${nf(c)}%</span></span>
          <span class="meter" title="Percentile ${nf(r.percentile, 1)}"><span class="z"></span><span class="m" style="left:calc(${Math.max(0, Math.min(100, r.percentile))}% - 2px)"></span></span>
        </span>
        <span class="r">
          ${r.yeni_sinyal ? '<span class="new">YENİ</span>' : ''}
          ${s.geri_alim && s.geri_alim.aktif ? `<span class="new" style="background:var(--up,#1a7f4b)" title="Son 30 günde ${s.geri_alim.n30} pay geri alım bildirimi (son: ${esc(s.geri_alim.son)})">🔁 Geri alım</span>` : ''}
          ${s.temel && s.temel.v3 && (s.temel.v3.etiketler || []).includes('Kotu bilanco surprizi') ? '<span class="warnb" title="Son bilanço kötü sürpriz">⚠ Bilanço</span>' : ''}
          ${s.temel && s.temel.v3 && (s.temel.v3.etiketler || []).includes('Hizli yukseldi') ? '<span class="warnb" title="Son 5 günde %15+ ya da 20 günde endeksten %30+ yükseldi">⚡ Hızlı</span>' : ''}
          ${s.temel && s.temel.v3 && (s.temel.v3.etiketler || []).includes('Sert dusus') ? '<span class="warnb" title="Son 20 günde endeksten %25+ fazla düştü ya da taban serisi (piyasa geneli değil)">▼ Sert düşüş</span>' : ''}
          ${tab === 'firsat' && !st.q ? fazBadge(s) : kutuChip(s)}
          ${tab === 'firsat' && !st.q ? `<small style="color:var(--mute)" title="IKARUS günlük sinyali (tek başına karar vermiyor)">günlük: ${esc(trLbl(r.sinyal))}</small>` : `<span class="badge b-${esc(r.sinyal)}">${esc(trLbl(r.sinyal))}</span>`}
          <small class="mono">${esc(rightText(r, tab, s))}</small>
        </span></a>`;
    })()).join('');
  }

  // Bulut listesi (Telegram: "ekle KCHOL 250") her cihazda gorunur; tarayici listesi yalniz bu cihazda.
  function eldeYerel() { try { return JSON.parse(localStorage.getItem('ik_elde') || '[]'); } catch (e) { return []; } }
  function elde() {
    const B = (st.bulut || []).map(x => Object.assign({}, x, {bulut: true}));
    const bt = new Set(B.map(x => x.t));
    return B.concat(eldeYerel().filter(x => !bt.has(x.t)));
  }
  function eldeKaydet(L) { try { localStorage.setItem('ik_elde', JSON.stringify(L.filter(x => !x.bulut).map(({t, fiyat, tarih}) => ({t, fiyat, tarih})))); } catch (e) {} }
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  const sg2 = (x) => (x >= 0 ? '+' : '−') + nf(Math.abs(x), 0) + '%';
  function eldeKarar(s, alis) {
    const r = s.D || {}, v = (s.temel && s.temel.v3) || {}, f = s.faz || {};
    const sat = [], dikkat = [];
    // 24 Kas (temel/stop2_sonuc.txt): zarar stopu %20 + yeri 120 gun nakitte tut + satis fiyatinin %10 ustunde geri gir
    if (alis && r.fiyat && r.fiyat <= alis * 0.8) sat.push(`Zarar stopu: alıştan ${sg2(100 * (r.fiyat / alis - 1))} (sınır −%20). Sat; yerini 120 güne kadar nakitte tut, başka hisse alma. Fiyat ${nf(r.fiyat * 1.1)} ₺ üstüne çıkarsa geri al. Telegram: "stop ${s.t} ${nf(r.fiyat)}"`);
    else if (alis && r.fiyat && r.fiyat <= alis * 0.85) dikkat.push(`Zarar stopuna yakın: alıştan ${sg2(100 * (r.fiyat / alis - 1))}; stop ${nf(alis * 0.8)} ₺`);
    const iz = ((st.data && st.data.elde_iz) || {})[s.t];
    if (r.percentile >= 90) sat.push(`Kâr al: fiyat pahalı bölgede (Percentile ${nf(r.percentile, 0)} ≥ 90)`);
    else if (r.percentile >= 80) dikkat.push(`Pahalı bölgeye girdi (Percentile ${nf(r.percentile, 0)}); kâr al 90’da`);
    if (iz && iz.tetik) sat.push(`Takip eden stop: zirve ${nf(iz.tepe)} ₺, stop ${nf(iz.stop)} ₺ altına indi`);
    if (v.sira != null && v.sira < 0.6) sat.push(`Temel bozuldu: temel puan sırası %${nf(100 * v.sira, 0)} (< %60)`);
    if ((v.etiketler || []).includes('Kotu bilanco surprizi')) sat.push('Temel bozuldu: kötü bilanço sürprizi');
    if (r.kirdi) dikkat.push('IKARUS stop çizgisi kırıldı');
    const fn = f.normal || {}, fh = f.ha || {};
    if (fn.sinyal === 'DAGITIM' && fn.gun >= 10) dikkat.push(`Faz motoru ${fn.gun} gündür DAĞITIM`);
    if (fh.sinyal === 'DAGITIM' && fh.gun >= 10) dikkat.push(`Heikin Ashi faz ${fh.gun} gündür DAĞITIM`);
    const izMetin = iz && !iz.tetik ? (iz.aktif ? `Takip eden stop ${nf(iz.stop)} ₺ (zirve ${nf(iz.tepe)} ₺’den %15 aşağı)` : `Takip eden stop ${nf(iz.aktiflesme)} ₺ üstünde başlar (alıştan +%20)`) : null;
    return {sat, dikkat, iz, izMetin, karar: sat.length ? 'SAT' : (dikkat.length ? 'DİKKAT' : 'TUT')};
  }
  function renderDefter() {
    const K = st.data.defter || {}, M = byT();
    const sg = (x) => x == null ? '–' : (x >= 0 ? '+' : '−') + nf(Math.abs(x), 1) + '%';
    const NED = {'bilanco bozuldu': 'bilanço bozuldu', 'pahali (kar al)': 'pahalı, kâr al', 'takip eden stop': 'takip eden stop', 'zarar stopu': 'zarar stopu (−%20)'};
    const ned = (n) => NED[n] || n || '';
    const gunFark = (a, b) => Math.max(0, Math.round((new Date(b) - new Date(a)) / 864e5));
    const acik = K.liste_acik || [], kap = K.liste_kapali || [], bek = K.bekleyen_al || [];
    // Mevduat karsilastirmasi: politika faizi %36 (Kasim 2026), basit faiz, yaklasik
    const mev = (a, b) => 36 * gunFark(a, b) / 365;
    const hepsi = acik.concat(kap).filter(x => x.getiri != null);
    const ortMev = hepsi.length ? hepsi.reduce((t, x) => t + mev(x.giris, x.cikis || K.son_gun), 0) / hepsi.length : null;
    const ozet = `<div class="row" style="grid-template-columns:1fr;display:block">
      <b>Başlangıç ${esc(K.baslangic || '–')} · son güncelleme ${esc(K.son_gun || '–')}</b><br>
      <small>Aşağıdaki liste GEÇERLİ (stoplu) kurala göre. Açık ${K.acik || 0} · kapanmış ${K.kapali || 0} kayıt${hepsi.length ? ` · aynı sürede mevduat yaklaşık ${sg(ortMev)}` : ' · henüz sonuç yok'}</small></div>`;
    const KR = K.kurallar || {};
    const krS = (ad, ac) => { const k = KR[ad]; if (!k) return '';
      return `<div class="row"><span class="l"><b>${ad === 'stoplu' ? 'STOPLU kural' : (ad === 'yeni' ? 'YENİ kural' : 'ESKİ kural')}</b><small>${esc(ac)}</small></span>
        <span class="r"><small class="mono">açık ${k.acik} · kapanan ${k.kapali}</small><small class="mono">${k.ort_getiri != null ? `ort. ${sg(k.ort_getiri)} · endekse göre ${sg(k.ort_fazla)} · geçen %${k.kazanan}` : 'henüz sonuç yok'}</small></span></div>`; };
    const krB = KR.yeni ? `<div class="ayrac">Çıkış kuralları yan yana</div>` + krS('stoplu', 'GEÇERLİ: yeni kural + zarar stopu (alıştan −%20) + satıştan sonra fiyat %10 yükselirse 120 gün içinde geri gir') + krS('yeni', 'Percentile ≥ 90’da kâr al + takip eden stop (alıştan +%20 sonra zirveden %15) + bilanço bozulursa sat') + krS('eski', 'Percentile ≥ 80’de kâr al + bilanço bozulursa sat') : '';
    const satir = (x, kapali) => {
      const s = M[x.t];
      const kb = !kapali && s && s.D ? kutuChip(s) : '';
      return `<a class="row" href="#/${encodeURIComponent(x.t)}"><span class="l"><b>${esc(x.t)}</b>
        <small>${esc(x.karar || '')} · giriş ${esc(x.giris)}${kapali ? ` → çıkış ${esc(x.cikis)} (${esc(ned(x.neden))})` : ` · ${gunFark(x.giris, K.son_gun)} gün${x.stop_aktif ? ` · stop ${nf(x.stop)} ₺` : (x.stop_aktiflesme ? ` · stop ${nf(x.stop_aktiflesme)} ₺ üstünde başlar` : '')}`}</small></span>
        <span class="r">${kb}<small class="mono">${sg(x.getiri)} · endekse göre ${sg(x.fazla)}</small></span></a>`;
    };
    const bekS = bek.length ? `<div class="ayrac">Bir sonraki kapanışta deftere girecek (${bek.length})</div>
      <div class="row" style="display:block"><small class="mono">${bek.map(b => esc(b[0]) + ' ' + esc(b[1].replace('AL ', ''))).join(' · ')}</small></div>` : '';
    const satB = Object.keys(K.bekleyen_sat || {}).length ? `<div class="ayrac">Bir sonraki kapanışta çıkacak</div>
      <div class="row" style="display:block"><small class="mono">${Object.entries(K.bekleyen_sat).map(([t, n]) => esc(t) + ' (' + esc(ned(n)) + ')').join(' · ')}</small></div>` : '';
    $('#list').innerHTML = ozet + krB + bekS + satB +
      `<div class="ayrac">Açık kayıtlar (${acik.length})</div>` + (acik.length ? acik.map(x => satir(x, false)).join('') : `<div class="empty">Henüz açık kayıt yok.</div>`) +
      `<div class="ayrac">Kapanmış kayıtlar (${kap.length})</div>` + (kap.length ? kap.slice().reverse().map(x => satir(x, true)).join('') : `<div class="empty">Henüz kapanmış kayıt yok.</div>`);
  }

  function renderElde() {
    const M = byT(), L = elde();
    const form = `<form id="eldeForm" class="eldef" style="grid-column:1/-1">
        <input id="eT" placeholder="Hisse kodu (KCHOL)" autocomplete="off" required>

  // Karar kutusu (16 Kas 2026). Kurallar Firsatlar/Eldekiler ile ayni; durumlar karar_bt testinde olculdu
  // (2020-09..2026-11, sonraki 63 islem gunu BIST100'e gore fazla getiri, medyan).
  const KTEST = {'AL ✓✓': '+3,3 puan (kazanan %59)', 'AL ✓': '+0,2 puan (kazanan %51)', 'teknik': '−1,3 puan', 'ucuz': '−3,2 puan', 'kacti': '−3,6 puan',
                 'pahali': '−2,4 puan (6 ayda −5,8)', 'orta': '−3,6 puan (ucuz + faz alımda −1,4)', 'zayif': '−5,9 puan', 'sert': '−7,5 puan', 'yok': '−7,6 puan'};
  function kutu(s) {
    const r = s.D || {}, v = (s.temel && s.temel.v3) || null, f = s.faz || {}, fi = s.fiyat_ivme || {};
    const fn = f.normal || {}, fh = f.ha || {};
    const et = (v && v.etiketler) || [];
    const P = r.percentile, o20 = fi.o20_x, o5 = fi.o5;
    const bil = !!v && v.sira >= 0.8 && !et.includes('Kotu bilanco surprizi');
    const ucuz = P != null && P <= 20;
    const kacmadi = !(o20 > 10 || o5 > 15);
    const tik = (fn.alim ? 1 : 0) + (fh.alim ? 1 : 0);
    const adim = [
      v && v.nad_karar ? [bil, 'NAD iskontosu', `holding: iskonto ${s.temel.nad ? '%' + nf(-100 * s.temel.nad.iskonto, 0) : '?'}, 3 yıllık geçmişinde yeri %${nf(v.nad_yuzdelik, 0)} (en derin %20 gerekir; konsolide bilanço puanı holdingde çalışmadı)`]
        : [bil, 'Bilanço', v ? `${v.grup === 'finans' ? 'bankalar/sigorta içinde ' : ''}sıra %${nf(100 * v.sira, 0)}${et.includes('Kotu bilanco surprizi') ? ', kötü sürpriz' : ''} (en üst %20 gerekir)` : 'puan yok'],
      [ucuz, 'Ucuz bölge', `Percentile ${nf(P, 0)} (≤ 20 gerekir)`],
      [kacmadi, 'Fiyat kaçmadı', `ayda endekse göre ${o20 >= 0 ? '+' : ''}${nf(o20, 1)}% (≤ +10), 5 günde ${o5 >= 0 ? '+' : ''}${nf(o5, 1)}%`],
      [tik > 0, 'Faz motoru', `normal ${trLbl(fn.sinyal)} ${fn.gun || ''}g · HA ${trLbl(fh.sinyal)} ${fh.gun || ''}g`]];
    let k, cls, neden, test;
    if (!v || v.sira == null) { k = 'BİLANÇO PUANI YOK'; cls = 'yok'; test = 'yok';
      neden = 'Bu hisse için bilanço puanı hesaplanamıyor (faktoring/leasing gibi farklı muhasebe yapısı ya da eksik veri). Sistem bilançosuz alım demiyor: testte yalnız teknikle alım kazandırmadı.'; }
    else if (v.sira < 0.6 || et.includes('Kotu bilanco surprizi')) { k = 'UZAK DUR'; cls = 'uzak'; test = 'zayif';
      neden = et.includes('Kotu bilanco surprizi') ? 'Son bilanço kötü sürpriz.' : `Bilanço zayıf: temel sırası %${nf(100 * v.sira, 0)}.`;
      neden += ucuz ? ' IKARUS ucuz bölgede dese de bilanço desteklemiyor; testte bu durum kaybettirdi.' : ''; }
    else if (et.includes('Sert dusus')) { k = 'UZAK DUR'; cls = 'uzak'; test = 'sert';
      neden = 'Hisseye özel sert düşüş: son 20 günde endeksten %25+ fazla düştü ya da taban serisi var. Önce sebebini (haber, KAP) öğren.'; }
    else if (v.sira < 0.8) { k = 'ORTA'; cls = 'bekle'; test = 'orta';
      neden = v.nad_karar ? `Holding: NAD iskontosu kendi 3 yıllık geçmişine göre derin değil (yeri %${nf(v.nad_yuzdelik, 0)}). Testte yalnız en derin %20 iskontoda belirgin avantaj vardı (6 ayda endekse göre ortalama +20 puan, az gözlem).`
        : `Bilanço orta seviyede (sıra %${nf(100 * v.sira, 0)}). Sistem net değil: testte bu grup belirgin bir avantaj göstermedi.`; }
    else if (P >= 80) { k = 'PAHALI'; cls = 'sat'; test = 'pahali';
      neden = 'Bilanço iyi ama fiyat son 200 günün pahalı bölgesinde (Percentile ≥ 80). Elindeyse Percentile 90’da kâr al; yeni alım için geri çekilme bekle.'; }
    else if (!kacmadi) { k = 'BEKLE'; cls = 'bekle'; test = 'kacti';
      neden = 'Bilanço iyi ama fiyat kaçtı: son bir ayda endeksten %10’dan fazla ya da 5 günde %15’ten fazla yükseldi. Bilançonun çoğu fiyatlanmış olabilir; sakinleşmesini bekle.'; }
    else if (!ucuz) { k = 'BEKLE'; cls = 'bekle'; test = 'ucuz';
      neden = 'Bilanço iyi ama fiyat ucuz bölgede değil (Percentile 20’nin üstünde). Ucuz bölgeye gelirse aday olur.'; }
    else if (tik === 2) { k = 'AL ✓✓'; cls = 'al'; test = 'AL ✓✓';
      neden = 'Bilanço güçlü, fiyat ucuz bölgede, kaçmamış; faz motoru hem normal hem Heikin Ashi mumda alım tarafında. Sistemin en güçlü durumu.'; }
    else if (tik === 1) { k = 'AL ✓'; cls = 'al'; test = 'AL ✓';
      neden = `Bilanço güçlü, fiyat ucuz bölgede, kaçmamış; faz motoru ${fn.alim ? 'normal mumda' : 'Heikin Ashi mumda'} alım tarafında, ${fn.alim ? 'Heikin Ashi' : 'normal'} henüz dönmedi.`; }
    else { k = 'BEKLE'; cls = 'bekle'; test = 'teknik';
      neden = 'Hisse iyi ve ucuz ama teknik henüz dönmedi: faz motoru alım tarafında değil. Faz dönünce AL olur; erken almak testte daha kötü sonuç verdi.'; }
    const eh = elde().find(x => x.t === s.t);
    const ek = eh ? eldeKarar(s, eh.fiyat) : null;
    const not_ = et.includes('Faaliyet iyi, net kar dustu') ? 'Not: Faaliyet iyi (satış, FAVÖK ve esas faaliyet kârı geçen yılın aynı çeyreğine göre güçlü) ama net kâr düştü; genelde finansman gideri, kur farkı ya da parasal kayıp gibi faaliyet dışı kalemlerden. Geçmişte bu tip hisseler (değer ve kalite de iyiyse) sonraki 2–3 ayda endeksi ortalama 3,4 puan geçti, ama 6 ayda geride kaldı (medyan −5,7). Kısa vadeli düşün, uzun tutma.' : '';
    return {k, cls, neden, test, adim, ek, eh, not_};
  }
  function kutuHtml(s) {

  function fazBadge(s) {

  const backSvg = () => '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';

  function para(x) {

  function fsVal(m) {

  function temelCard(s) {

    if (!k || !k.maddeler) return `<section class="card" aria-label="Temel analiz"><h2>Temel analiz</h2><p class="note" style="margin:0">Bu hisse için bilanço verisi henüz yok. Temel veri her cumartesi sabahı güncellenir.</p></section>`;
    const o = k.oranlar || {};
    const kat = (x) => x == null || isNaN(x) ? '–' : nf(x, 1);
    const yz = (x) => x == null || isNaN(x) ? '–' : (x < 0 ? '−%' : '%') + nf(100 * Math.abs(x), 0);
    const banka = k.tip === 'banka';
    const nbf = ['N.borç/FAVÖK', o.favok_negatif ? 'FAVÖK −' : o.net_nakit ? 'net nakit' : o.net_borc_favok == null ? '–' : nf(o.net_borc_favok, 1)];
    // 22 Kas: Asil F/K = firma degeri / FAVOK (net parasal pozisyon, kur farki, faiz ve TMS 29 amortismani disarida)
    const q = banka ? [['F/K', kat(k.fk)], ['PD/DD', kat(k.pddd)], ['ROE', yz(o.roe)], ['Özk. reel büy.', yz(o.ozkaynak_reel_buyume)]]
      : [['Asıl F/K (FD/FAVÖK)', o.favok_negatif ? 'FAVÖK −' : kat(k.fd_favok)], ['F/K (net kâr)', kat(k.fk)], ['F/K parasalsız*', k.parasal_pay != null && k.parasal_pay >= 1 ? 'zarar' : kat(k.fk_parasalsiz)],
         ['PD/DD', kat(k.pddd)], ['ROE', yz(o.roe)], nbf];
    const rows = k.maddeler.map(m => `<div class="fs">${m.gecti === true ? okSvg() : m.gecti === false ? noSvg() : naSvg()}<span>${esc(m.ad)}</span><em class="mono">${esc(fsVal(m))}</em><p>${esc(m.aciklama)}</p></div>`).join('');
    const [y, a] = String(k.donem).split('/');
    return v3Card(k) + bankaCard(k) + istirakCard(k) + nadCard(k) + `<section class="card" aria-label="Temel analiz">
      <h2>Temel analiz · ${k.puan}/${k.en_fazla}${k.olculen < k.en_fazla ? ` <span style="font-weight:400;color:var(--mute);font-size:12px">(${k.olculen} ölçülebildi)</span>` : ''}</h2>
      <div class="quad"${q.length > 4 ? ' style="grid-template-columns:repeat(3,minmax(0,1fr));row-gap:10px"' : ''}>${q.map(([l, v]) => `<div><small>${l}</small><strong class="mono">${v}</strong></div>`).join('')}</div>
      ${rows}
      <p class="note">${banka ? 'Banka' : 'Şirket'} bilançosu: ${a}/${y} dönemi, gelir ve nakit kalemleri son 4 çeyrek toplamı; karşılaştırma geçen yılın aynı dönemiyle${k.bilanco_karsilastirma && k.bilanco_karsilastirma !== `${y - 1}/${a}` ? ` (bilançoda ${k.bilanco_karsilastirma.split('/').reverse().join('/')} kullanıldı, o dönem kaynakta boş)` : ''}. Enflasyon muhasebesi nedeniyle dönemler arası küçük kaymalar olabilir. ${!banka && k.parasal_pay != null ? `* Parasalsız F/K: net kârdan tahmini net parasal pozisyon kazancı (vergi sonrası) çıkarılmış hali; tahmini parasal kazanç / net kâr: %${nf(Math.max(0, 100 * k.parasal_pay), 0)} (kâğıt üstü kısım)${k.parasal_pay >= 1 ? ' (çıkarılınca zarar)' : ''}. Tahmin bilançodan yapılır, %10–30 sapabilir; bilgi içindir, puana girmez. ` : ''}${banka ? '' : 'Asıl F/K = firma değeri (piyasa değeri + net borç) / son 4 çeyrek FAVÖK: net parasal pozisyon kazancı/kaybı, kur farkı, faiz ve enflasyonla şişen amortisman bu kârın dışında kalır; borç da firma değerine eklenir. Temel puanın değer kısmı bunu kullanır (22 Kas testi). '}${k.gyo_kagit_pay != null && k.gyo_kagit_pay > 0.5 ? `GYO notu: faaliyet kârının yaklaşık %${nf(Math.min(100, 100 * k.gyo_kagit_pay), 0)}’i gayrimenkul değer artışı gibi kâğıt üstü kazanç (faaliyet kârı − brüt kâr ile tahmin). Testte sistem bu tür GYO’ları biraz fazla ödüllendirdi: en iyi %20’deki kâğıt kârı yüksek GYO’lar 6 ayda medyan +%9,9, düşük olanlar +%17,2 (ikisi de piyasanın üstünde). Bilgi içindir, karara girmez. ` : ''}Kaynak: İş Yatırım mali tabloları. Bilanço rakamları; faaliyet raporu, ortaklık yapısı ve haberler ayrıca okunmalı.</p>
    </section>`;
  }

  const ETK = {'Bilanco ivmesi guclu': ['Bilanço ivmesi güçlü', 'ok'], 'Kotu bilanco surprizi': ['Kötü bilanço sürprizi', 'kotu'],
               'Zarardan kara dondu': ['Zarardan kâra döndü', 'ok'], 'Kaliteli bilanco': ['Kaliteli bilanço', 'ok'], 'Hizli yukseldi': ['Hızlı yükseldi (fiyatlanmış olabilir)', 'kotu'], 'Sert dusus': ['Hisseye özel sert düşüş', 'kotu'], 'Zayif bilanco': ['Zayıf bilanço', 'kotu']};
  function v3Card(k) {
    const v = k.v3;
    if (!v || v.toplam == null) return '';
    const bar = (l, x, d) => `<div class="kv"><span>${l} <small style="color:var(--mute)">${d}</small></span><strong class="mono">${x == null ? '–' : nf(100 * x, 0)}<span class="mini" aria-hidden="true"><i style="width:${x == null ? 0 : Math.round(100 * x)}%"></i></span></strong></div>`;
    const R = v.siralar || {};
    const yuz = (x) => x == null ? '–' : nf(100 * x, 0);
    const chips = (v.etiketler || []).map(e => { const [l, c] = ETK[e] || [e, '']; return `<span class="chip ${c}">${esc(l)}</span>`; }).join('');
    return `<section class="card" aria-label="Temel puan">
      <h2>Temel puan · ${nf(100 * v.toplam, 0)}/100 <span style="font-weight:400;color:var(--mute);font-size:12px">(${v.dilim === 5 ? 'en üst %20' : v.dilim === 1 ? 'en alt %20' : v.dilim + '. dilim'}, ${v.n} şirket içinde)</span></h2>
      ${chips ? `<div class="chips">${chips}</div>` : ''}
      ${v.yorum ? `<p class="hint desc" style="margin:6px 0 10px">${esc(v.yorum)}</p>` : ''}
      ${bar('Bilanço ivmesi', v.hareket, '1/3')}
      ${bar('Kalite', v.kalite, '1/3')}
      ${bar('Değerleme', v.deger, '1/3')}
      <p class="note">Her sayı, bu şirketin bankalar dışındaki BIST şirketleri arasındaki sırası (100 = en iyi). İvme: net kâr sürprizi ${yuz(R.sue_nk)}, esas faaliyet kârı sürprizi ${yuz(R.sue_faal)}, satışların M3’e göre büyümesi ${yuz(R.satis_reel)}, kârlılık (ROE) artışı ${yuz(R.roe_ivme)}. Kalite: F-skoru ${yuz(R.F)}, ROE ${yuz(R.roe)}. Değerleme: kâr/piyasa değeri ${yuz(R.kaz_get)}, PD/DD ucuzluğu ${yuz(R.pddd)}. Sürpriz = bu çeyreğin kârı, geçen yılın aynı çeyreğinin M3 kadar büyütülmüş halinden ne kadar iyi (şirketin kendi oynaklığına göre). 2020–2026 testinde en güçlü işaretler kâr sürprizi ve satış büyümesiydi; iki sürprizin de en kötü %20’de olması ise ucuz ve kaliteli şirketlerde bile kaybettirdi.</p>
    </section>`;
  }
  // 24 Kas (temel/bankalar_sonuc.txt): bankaya ozgu olculer; nim_deg, maliyet/gelir, risk maliyeti, komisyon buyumesi banka puanina girer
  function bankaCard(k) {
    const b = k.banka;
    if (!b || b.hata) return '';
    const p = (v, d = 1) => v == null ? '—' : '%' + nf(100 * v, d);
    const sat = [
      ['Net faiz marjı (NIM)', p(b.nim), 'Net faiz geliri / ortalama aktif (son 4 çeyrek).'],
      ['NIM değişimi (1 yıl)', b.nim_deg == null ? '—' : (b.nim_deg >= 0 ? '+' : '') + nf(100 * b.nim_deg, 1) + ' puan', 'Faiz döngüsünün bankaya etkisi. Puana girer (yüksek iyi).'],
      ['Maliyet / gelir', p(b.maliyet_gelir, 0), 'Faaliyet giderleri / faaliyet gelirleri. Puana girer (düşük iyi).'],
      ['Risk maliyeti', p(b.risk_maliyeti, 1), 'Kredi karşılık gideri / krediler. Puana girer (düşük iyi).'],
      ['Komisyon geliri reel büyüme', p(b.komisyon_reel, 0), 'Net ücret-komisyon gelirinin enflasyondan arındırılmış yıllık büyümesi. Puana girer.'],
      ['Kredi / mevduat', p(b.kredi_mevduat, 0), 'Bilgi.'],
      ['Özkaynak / aktif', p(b.ozk_aktif, 1), 'Sermaye tamponu. Bilgi (testte 2025 öncesi güçlüydü, 2025+ ters).']
    ].map(([a, v, d]) => `<div class="fs"><span>${a}</span><em class="mono">${v}</em><p>${d}</p></div>`).join('');
    return `<section class="card" aria-label="Banka ölçüleri"><h2>Banka ölçüleri</h2>${sat}<p class="note">Banka puanı (24 Kas): eski ölçülere (kâr/PD, PD/DD, ROE, F, bilanço sürprizi, net faiz geliri büyümesi, ROE ivmesi) bu dört bankacılık ölçüsü eklendi. 2014–2026 testinde (12 banka) iyi ve kötü üçte bir arasındaki 6 aylık ortanca farkı 2014–17 −1, 2018–20 +7, 2021–24 +15, 2025+ +10 puan; eski puanda 2025+ −2 idi. 12 bankayla kanıt orta düzeyde. Katılım bankalarında (ALBRK) bu kalemler gelmiyor.</p></section>`;
  }
  // 24 Kas (temel/icinden_sonuc.txt): gercek holdinglerde istiraklerin bilanco puani (bilgi; karara girmez)
  function istirakCard(k) {
    const p = k.istirak_puani;
    if (!p) return '';
    const sat = p.istirakler.map(x => `<div class="fs"><span>${esc(x.t)}</span><em class="mono">pay %${nf(100 * x.pay, 0)} · sıra %${nf(100 * x.sira, 0)}</em><p>Holdingin borsadaki iştirak değerinde ağırlığı %${nf(100 * x.agirlik, 0)}.</p></div>`).join('');
    return `<section class="card" aria-label="İştirak puanı"><h2>İştiraklerin bilanço puanı · %${nf(100 * p.puan, 0)}</h2>${sat}
      <p class="note">Holdingin borsadaki iştiraklerinin (bankalar hariç) temel puan sıralarının, holdingin payı × piyasa değeriyle ağırlıklı ortalaması. Kapsam: borsadaki iştirak değerinin %${nf(100 * p.kapsam, 0)}'i. 2014–2026 testinde (12 holding) iştirak puanı yüksek (≥ %70) holdingler 6 ayda piyasayı ortanca +%4,8 geçti, düşükler (≤ %40) −%4,9 geride kaldı. Ama holdingin kendi bilanço puanı daha güçlü çıktı (kendi sırası ≥ %80: 6 ayda ortanca +%8,6, kazanma %62) ve iştirak puanını eklemek bunu iyileştirmedi; bu yüzden karar kutusu holdingin kendi puanına bakar, bu kart bilgi içindir.</p></section>`;
  }
  function nadCard(k) {
    const n = k.nad;
    if (!n) return '';
    const yz = (x) => x == null ? '–' : (x < 0 ? '−%' : '%') + nf(100 * Math.abs(x), 1);
    const durum = {'DERIN ISKONTO, KAPANIYOR': 'Derin iskonto, kapanmaya başladı', 'DERIN ISKONTO': 'Derin iskonto (son 3 yılın en derin %20’si)', 'ISKONTO DAR': 'İskonto dar (son 3 yılın en dar %20’si)', 'NORMAL': 'Son 3 yılın normal aralığında'}[n.durum] || n.durum;
    return `<section class="card" aria-label="Net aktif değer">
      <h2>Net aktif değer (NAD) iskontosu</h2>
      <div class="quad">
        <div><small>İskonto</small><strong class="mono">${yz(n.iskonto)}</strong></div>
        <div><small>3 yıl ort.</small><strong class="mono">${yz(n.ort_3y)}</strong></div>
        <div><small>3 yılda yeri</small><strong class="mono">${nf(n.yuzdelik_3y, 0)}/100</strong></div>
        <div><small>20 günde</small><strong class="mono">${n.degisim_20g == null ? '–' : (n.degisim_20g >= 0 ? '+' : '−') + nf(100 * Math.abs(n.degisim_20g), 1) + ' puan'}</strong></div>
      </div>
      <p class="hint desc" style="margin:8px 0">${esc(durum)}</p>
      <p class="note">NAD = borsadaki iştiraklerin bugünkü değeri × holdingin payı + borsada olmayan iştiraklerin defter değeri + net nakit = ${nf(n.nad_mn / 1000, 0)} mr ₺. Holdingin piyasa değeri ${nf(n.pd_mn / 1000, 0)} mr ₺. İskonto ne kadar derinse holding iştiraklerine göre o kadar ucuz.${n.uzun_vade != null ? ` Uzun vadeli ortalama yaklaşık ${yz(n.uzun_vade)}.` : ''} 3 yılda yeri: 0 = en derin iskonto, 100 = en dar. Paylar: ${esc(n.kaynak)}; geçmiş seri bugünkü paylarla hesaplandığı için yaklaşık.${n.fiyatsiz && n.fiyatsiz.length ? ' Fiyatı alınamayan: ' + esc(n.fiyatsiz.join(', ')) + ' (referans değerde tutuldu).' : ''}</p>
    </section>`;
  }

  function route() { const m = location.hash.match(/^#\/(.+)$/); return m ? decodeURIComponent(m[1]).toUpperCase() : null; }

  function render() {
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.tf === st.tf)));
    renderMarket();
    const t = route();
    $('#home').classList.toggle('hidden', !!t);
    $('#detail').classList.toggle('hidden', !t);
    if (t) { renderDetail(t); document.title = t + ' · IKARUS'; }
    else { renderTabs(); renderList(); document.title = 'IKARUS Quant'; }
  }

  document.addEventListener('click', (e) => {
    const gb = e.target.closest('[data-grp]');
    if (gb) { const G = GROUPS.find(x => x[0] === gb.dataset.grp); st.tab = load('tab_' + G[0], G[2][0]); if (!G[2].includes(st.tab)) st.tab = G[2][0];
      st.q = ''; $('#q').value = ''; save('tab4', st.tab); render(); return; }
    const tb = e.target.closest('[data-tab]');
    if (tb) { st.tab = tb.dataset.tab; st.q = ''; $('#q').value = ''; save('tab4', st.tab); save('tab_' + grpOf(st.tab), st.tab); render(); return; }
    const tf = e.target.closest('[data-tf]');
    if (tf) { st.tf = tf.dataset.tf; save('tf', st.tf); render(); return; }
    if (e.target.closest('[data-back]')) { if (history.length > 1) history.back(); else location.hash = ''; }
  });
  $('#q').addEventListener('input', (e) => { st.q = e.target.value; renderTabs(); renderList(); });
  window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchData(); });

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
  fetchData();
})();
</script>
</body>
</html>
